name: Judgment and prediction cases

on:
  pull_request:
    paths:
      - "applications/**"
      - "research/**"
      - "README*"
      - "tests/**"
      - ".github/workflows/judgment-validation.yml"
  push:
    paths:
      - "applications/**"
      - "research/**"
      - "framework/**"
      - "README*"
      - "research/**"
      - "tests/**"
      - ".github/workflows/judgment-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run formal case and Markdown checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
